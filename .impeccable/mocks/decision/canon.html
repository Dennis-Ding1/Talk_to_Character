<!doctype html>
<html><head><meta charset="utf-8"><title>Category standard</title>
<style>
  html,body{margin:0;width:1440px;height:900px;overflow:hidden;background:#141414;font-family:system-ui,sans-serif;color:#fff}
  .nav{height:64px;display:flex;align-items:center;padding:0 32px;gap:24px;border-bottom:1px solid #262626}
  .logo{color:#e50914;font-weight:800;font-size:26px}
  .player{position:absolute;left:0;top:64px;width:1040px;height:836px;background:#000}
  .vid{position:absolute;left:0;top:120px;width:1040px;height:585px;background:linear-gradient(160deg,#3d4a52,#141b20)}
  .bar{position:absolute;left:40px;right:40px;bottom:60px;height:5px;background:#444}.bar i{display:block;width:60%;height:100%;background:#e50914}
  .side{position:absolute;right:0;top:64px;width:400px;bottom:0;background:#1f1f1f;padding:24px;box-sizing:border-box}
  .av{width:72px;height:72px;border-radius:50%;background:#555;display:inline-block;vertical-align:middle}
  .nm{display:inline-block;vertical-align:middle;margin-left:14px;font-size:24px;font-weight:700}
  .b{margin-top:22px;padding:14px 16px;border-radius:14px;font-size:22px;max-width:80%}
  .b.u{margin-left:auto;background:#e50914}.b.a{background:#2f2f2f}
  .in{position:absolute;left:24px;right:24px;bottom:24px;height:52px;border-radius:26px;background:#2f2f2f}
</style></head><body>
<div class="nav"><span class="logo">TALK TO CHARACTER</span></div>
<div class="player"><div class="vid"></div><div class="bar"><i></i></div></div>
<div class="side"><span class="av"></span><span class="nm">Oppenheimer</span>
<div class="b u">Did the bomb work?</div>
<div class="b a">It hasn't happened yet. We're still building it.</div>
<div class="in"></div></div>
</body></html>
