[project]
name = "talk-to-character"
version = "0.1.0"
description = "Pause a movie and talk to its characters — Boson AI Higgs hackathon"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "python-multipart>=0.0.9",
  "rank-bm25>=0.2.2",
  "pysrt>=1.1.2",
  "typer>=0.12",
  "websockets>=12.0",
  # face recognition when the viewer clicks a face on the paused frame
  "numpy>=1.26",
  "opencv-python-headless>=4.10",
]

[project.optional-dependencies]
# Heavy, local-only tools for the offline pipeline (all free / open source)
preprocess = [
  "faster-whisper>=1.0",
  "demucs>=4.0",
]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
ttc-preprocess = "preprocess.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "preprocess*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
